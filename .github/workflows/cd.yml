name: CD Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
  workflow_dispatch:

jobs:
  update-readme-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump AppVersion in README
        run: |
          DATE_NOW=$(date +"%Y-%m-%d %H:%M:%S")
          CURRENT_VER=$(grep -oP 'AppVersion-\K[0-9]+' README.md || echo "0")
          NEXT_VER=$((CURRENT_VER + 1))
          sed -i -E "s/AppVersion-[0-9]+/AppVersion-$NEXT_VER ($DATE_NOW)/g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "cd: Bump AppVersion-$NEXT_VER" || echo "No hay cambios"
          git push

  validate-prod:
    needs: update-readme-cd
    runs-on: self-hosted
    steps:
      - name: Validate PROD Secret
        run: |
          if [ "$LOCAL_PROD_TOKEN" = "${{ secrets.PROD_TOKEN }}" ]; then
            echo "PROD Token validado correctamente."
          else
            echo "ERROR: LOCAL_PROD_TOKEN no coincide con PROD_TOKEN"
            exit 1
          fi